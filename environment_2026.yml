name: 2026-icesat2-tracks
channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.11
  - pip

  # Scientific stack (conda is better for these)
  - numpy>=1.26.3,<2.0.0
  - pandas>=2.2.0,<3.0.0
  - xarray>=2024.1.0
  - numba>=0.58.1,<1.0.0

  # Geospatial (IMPORTANT: keep in conda)
  - geopandas>=0.14.2,<1.0.0
  - netcdf4>=1.6.5,<2.0.0
  - h5py>=3.5.0,<4.0.0
  - pytables>=3.9.2,<4.0.0

  # Astronomy / science
  # - astropy>=5.2,<=6.0.0

  # MPI (requires system MPI as you noted)
  - mpi4py>=3.1.4,<4.0.0

  # Optional but often needed for geopandas stack
  - shapely
  - fiona
  - pyproj
  - gdal

  # Pip-installed packages (not reliable or unavailable in conda)
  - pip:
      - piecewise_regression>=1.3.0,<2.0.0
      - icesat2-toolkit>=1.0.0.22,<2.0.0
      - sliderule>=4.2.3,<5.0.0
      - ipyleaflet>=0.18.1,<0.19.0
      - lmfit>=1.2.2,<2.0.0
      - emcee>=3.1.4,<4.0.0
      - siphon>=0.9,<1.0.0
      - termcolor>=2.4.0,<3.0.0
      - typer>=0.9.0,<1.0.0
      - getmem>=1.0,<=1.0.0
