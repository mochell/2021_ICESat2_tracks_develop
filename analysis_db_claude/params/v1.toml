# Per-stage processing parameters, version v1.
# Values are the ones that were hard-coded in analysis_db/*.py (2026-09-22).
# Each stage reads only its own table; the table's hash is stored in every status record,
# so changing a value here reruns exactly that stage (and everything downstream).
version = "v1"

# ------------------------------------------------------------------ B01 SlideRule download
[B01]
maximum_height = 30          # m, |h_mean - dem_h| above this is removed (sct.correct_and_remove_height)
beam_stats_Lmeter = 12500    # m, window for beam_stats.derive_beam_statistics
beam_stats_dx = 10           # m
min_points_per_track = 1000  # fewer points in the box -> skip 'too few points'
min_points_per_beam = 200    # any beam with fewer points -> skip the track

[B01.sliderule]              # icesat2.atl06p request (params_yapc in B01_SL_load_single_file.py)
srt = 1                      # ocean surface type
len = 20                     # segment length (m)
ats = 3
res = 10                     # one segment every 10 m
dist_in_seg = false
track = 0                    # all ground tracks
pass_invalid = false
cnf = 2
cnt = 20
sigma_r_max = 4
maxi = 10
atl03_geo_fields = ["dem_h"]

[B01.sliderule.yapc]
knn = 0
win_h = 6
win_x = 11
min_ph = 4
score = 100

# ------------------------------------------------------------------ A02 WW3 prior (IOWAGA THREDDS)
[A02]
catalog_url = "https://tds3.ifremer.fr/thredds/IOWAGA-WW3-FORECAST/IOWAGA-WW3-FORECAST_GLOBMULTI_GLOB-30M.xml"
dataset = "IOWAGA-WW3-FORECAST_GLOBMULTI_GLOB-30M_FIELD_NC_MARC_WW3-GLOB-30M"
dtime_h = 4
nan_frac_max = 0.3           # ice-mask nan fraction accepted in the prior box
lat_shift_max_iter = 20      # cap on the prior-box latitude shifting loop (was unbounded)

[A02.SH]
dlon_deg = 1
dlat_deg = [30, 5]
dlat_deg_prior = [2, 1]

[A02.NH]
dlon_deg = 2
dlat_deg = [20, 20]
dlat_deg_prior = [2, 1]

# ------------------------------------------------------------------ B02 gFT / FFT spectra
[B02]
T_max = 40                   # s, longest period -> k_0
T_min = 6                    # s, shortest period -> lambda_min
L_factor = 10                # Lpoints = round(2*pi/k_0/dx) * L_factor  (-> 25 km for dx = 10 m)
oversample = 2               # dlambda = Lmeters * oversample
k_stride = 2                 # kk = kk[::k_stride]   ("reduced frequency resolution")
max_nfev = 8000
max_nan_fraction = 0.95      # mean nan fraction over beams above this -> skip
beam_ratio_max = 10          # beam-pair size ratio outside [1/r, r] -> skip
min_data_fraction_beam = 0.005  # beam with less coverage is skipped (was a commented-out `continue`)
min_points_beam = 100        # beams with fewer (valid) points are skipped
N_photos_min = 5             # points with N_photos <= this are treated as nan
dd_error_fill = 100
spike_spreed = 10            # spicke_remover
n_threads = 4                # threadpool_limits for BLAS
psd_blowup = 1e6             # diagnostics: stancils with max PSD above this are counted in info.n_psd_blowup

# ------------------------------------------------------------------ B03 spectra overview plots
[B03]
k_thresh = 0.085             # low-pass wavenumber for the reconstruction panel
n_x_examples = 3             # number of x positions with reconstruction figures
x_examples_mode = "first"    # "first": the first n stancils with data; "spread": n stancils spread over the track
include_peak_example = false # also plot the stancil with the largest mean PSD
rolling_k = 5                # rolling mean over k of the weighted-mean spectrogram (k_max search)
rolling_k_x = [10, 3]        # rolling medians over (k, x) of the weighted mean (colour levels + panel)
rolling_k_spec = 10          # rolling mean over k of the per-beam spectra in the reconstruction figure
k_max_first_x = [5, 20]      # k_max from the mean over the first N x stancils; second value is the fallback
k_max_band = [0.75, 1.25]    # k_max * band -> integration range for the 'Peak Spectral Power' panel
xlim_pad_dx = 40             # reconstruction panels: xlim padding in units of the eta spacing
eta_edge_points = 1000       # low-k reconstruction: xlim from eta[n] to eta[-n], n = min(this, len(eta)//4)

# ------------------------------------------------------------------ B04 MCMC angle inversion
[B04]
N_sample_chain = 300
N_sample_chain_burn = 30
max_wavenumbers = 25
max_x_pos = 8
x_pos_jump = 2
alpha_range = [-0.85, 0.85]  # times pi/2
alpha_walkers = 5
phase_walkers = 10
alpha_dx = 0.02
prior_weight = 2
prior_smooth_points = 30
prior_spread_fill_deg = 20
angle_gate_deg = 80          # all |prior angle| above this -> skip
variance_frac = 0.20
k_prime_max_test = 0.02

# ------------------------------------------------------------------ B05 angle PDF
[B05]
lanczos_cutoff = 0.1
min_x_segments = 2
n_polar_chunks = 3

# ------------------------------------------------------------------ B06 spectral correction
[B06]
smooth_k = 30
smooth_k_lim_x = 3
coverage_min = 0.1
n_breakpoints = 3
n_breakpoints_max = 4
tanh_sigma_g = 0.003
angle_front_x = 3            # number of leading x stancils used for the front angle
plot_smooth_k = 20           # rolling window (k) for the per-beam spectra in the B06_atten_ov figure (plot only)
plot_smooth_x = 2            # rolling window (x) for the same figure (plot only)

# ------------------------------------------------------------------ C01 database collector
[C01]
k_variables = ["gFT_PSD_data", "gFT_PSD_model", "N_per_stancil", "N_photons", "spec_adjust",
               "x_coord", "y_coord", "lon", "lat"]
float32 = true
