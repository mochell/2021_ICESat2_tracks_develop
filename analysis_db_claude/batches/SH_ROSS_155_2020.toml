# Ross Sea, Jan-Jun 2020 (polygon crosses the antimeridian)
[batch]
key            = "SH_ROSS_155_2020"     # must start with "<HEMIS>_"
hemis          = "SH"
description    = "Ross Sea polygon, 2020-01-01..06-30"
params_version = "v1"                       # -> params/v1.toml

[region]
# lat = [-67.2, -62.0]
# lon = [140.0, 155.0]
# [lon, lat] vertices, any order; the ring is closed and oriented automatically
polygon = [[-161.24,-78.12],[-192.41,-75.54],[-176.10,-59.08],[-144.93,-64.45],[-161.24,-78.12]]

[time]
t0 = "2020-01-01T00:00:00"
t1 = "2020-06-30T00:00:00"
chunk_days = 30                             # one SlideRule request per chunk; 0 = whole window

[selection]
max_tracks   = 0                           # 0 = all; first N by time
include_ids  = []
exclude_ids  = []
require_rgt  = true                         # drop granules whose RGT is not in the shapefile subset

[sliderule]
desired_nodes = 5
time_to_live  = 120                         # minutes; nodes take ~2-3 min to come up
