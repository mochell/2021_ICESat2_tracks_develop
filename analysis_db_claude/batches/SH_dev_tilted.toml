# Dev batch with a tilted polygon instead of a lat/lon box (same area as SH_dev_small, rotated ~20 deg)
[batch]
key            = "SH_dev_tilted"
hemis          = "SH"
description    = "dev: tilted quadrilateral off Wilkes Land, 2019-05-01..05-05"
params_version = "v1"

[region]
# [lon, lat] vertices, any order; the ring is closed and oriented automatically
polygon = [[141.0, -62.5], [156.0, -64.5], [153.0, -68.0], [138.5, -66.0]]

[time]
t0 = "2019-05-01T00:00:00"
t1 = "2019-05-05T00:00:00"
chunk_days = 0

[selection]
max_tracks   = 10
include_ids  = []
exclude_ids  = []
require_rgt  = true

[sliderule]
desired_nodes = 3
time_to_live  = 120
